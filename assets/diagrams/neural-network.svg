<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">Schematic artificial neural network with three layers</title>
<desc id="desc">Four input nodes connect to five hidden nodes, which connect to three output nodes. Arrows indicate information flowing from left to right. Connections represent adjustable weights. This is a simplified teaching illustration, not a trained digit classifier.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#27A9E5"/></marker></defs>
<rect width="1200" height="675" fill="#F4E9D0"/><rect x="20" y="20" width="1160" height="635" rx="20" fill="#FAF7EF" stroke="#BB8539" stroke-width="4"/>
<text x="600" y="78" font-family="Georgia,serif" font-size="37" font-weight="bold" fill="#163043" text-anchor="middle">How a Neural Network Is Connected</text>
<text x="600" y="115" font-family="Aptos,Arial,sans-serif" font-size="19" fill="#52646E" text-anchor="middle">Simplified architecture — connections carry adjustable weights</text>
<g font-family="Aptos,Arial,sans-serif" font-size="25" font-weight="bold" text-anchor="middle" fill="#163043"><text x="230" y="170">Input layer</text><text x="600" y="170">Hidden layer</text><text x="970" y="170">Output layer</text></g>
<g stroke="#27A9E5" stroke-width="2.3" opacity="0.55" fill="none"><line x1="248" y1="240" x2="578" y2="210"/><line x1="248" y1="240" x2="578" y2="290"/><line x1="248" y1="240" x2="578" y2="370"/><line x1="248" y1="240" x2="578" y2="450"/><line x1="248" y1="240" x2="578" y2="530"/><line x1="248" y1="330" x2="578" y2="210"/><line x1="248" y1="330" x2="578" y2="290"/><line x1="248" y1="330" x2="578" y2="370"/><line x1="248" y1="330" x2="578" y2="450"/><line x1="248" y1="330" x2="578" y2="530"/><line x1="248" y1="420" x2="578" y2="210"/><line x1="248" y1="420" x2="578" y2="290"/><line x1="248" y1="420" x2="578" y2="370"/><line x1="248" y1="420" x2="578" y2="450"/><line x1="248" y1="420" x2="578" y2="530"/><line x1="248" y1="510" x2="578" y2="210"/><line x1="248" y1="510" x2="578" y2="290"/><line x1="248" y1="510" x2="578" y2="370"/><line x1="248" y1="510" x2="578" y2="450"/><line x1="248" y1="510" x2="578" y2="530"/><line x1="622" y1="210" x2="948" y2="280"/><line x1="622" y1="210" x2="948" y2="370"/><line x1="622" y1="210" x2="948" y2="460"/><line x1="622" y1="290" x2="948" y2="280"/><line x1="622" y1="290" x2="948" y2="370"/><line x1="622" y1="290" x2="948" y2="460"/><line x1="622" y1="370" x2="948" y2="280"/><line x1="622" y1="370" x2="948" y2="370"/><line x1="622" y1="370" x2="948" y2="460"/><line x1="622" y1="450" x2="948" y2="280"/><line x1="622" y1="450" x2="948" y2="370"/><line x1="622" y1="450" x2="948" y2="460"/><line x1="622" y1="530" x2="948" y2="280"/><line x1="622" y1="530" x2="948" y2="370"/><line x1="622" y1="530" x2="948" y2="460"/></g><g fill="#122A3E" stroke="#27A9E5" stroke-width="4"><circle cx="230" cy="240" r="22"/><circle cx="230" cy="330" r="22"/><circle cx="230" cy="420" r="22"/><circle cx="230" cy="510" r="22"/><circle cx="600" cy="210" r="22"/><circle cx="600" cy="290" r="22"/><circle cx="600" cy="370" r="22"/><circle cx="600" cy="450" r="22"/><circle cx="600" cy="530" r="22"/><circle cx="970" cy="280" r="22"/><circle cx="970" cy="370" r="22"/