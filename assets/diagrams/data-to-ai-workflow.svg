<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">From a handwritten-digit image to a neural-network prediction</title>
<desc id="desc">A schematic pipeline: raw digit image, preprocessing, numerical pixel values, neural network, and predicted digit. The correct training label is shown separately, because the model prediction and the true label are not the same concept. No actual model inference is claimed.</desc>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#27A9E5"/></marker></defs>
<rect width="1440" height="720" fill="#0C1B2B"/><rect x="22" y="22" width="1396" height="676" rx="18" fill="#122A3E" stroke="#BB8539" stroke-width="4"/>
<text x="720" y="90" text-anchor="middle" font-family="Georgia,serif" font-size="39" font-weight="bold" fill="#F4E9D0">From Data to AI Prediction</text>
<text x="720" y="132" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="21" fill="#84DAF8">Handwritten-digit recognition — conceptual example</text>
<rect x="65" y="222" width="210" height="260" rx="18" fill="#FAF7EF" stroke="#BB8539" stroke-width="3"/><circle cx="91" cy="248" r="18" fill="#163043"/><text x="91" y="255" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="bold" fill="#84DAF8">1</text><text x="170" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#163043">Raw image</text><text x="170" y="350" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#52646E">Handwritten digit</text><rect x="340" y="222" width="210" height="260" rx="18" fill="#FAF7EF" stroke="#BB8539" stroke-width="3"/><circle cx="366" cy="248" r="18" fill="#163043"/><text x="366" y="255" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="bold" fill="#84DAF8">2</text><text x="445" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#163043">Preprocessing</text><text x="445" y="350" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#52646E">Resize / normalize</text><rect x="615" y="222" width="210" height="260" rx="18" fill="#FAF7EF" stroke="#BB8539" stroke-width="3"/><circle cx="641" cy="248" r="18" fill="#163043"/><text x="641" y="255" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="bold" fill="#84DAF8">3</text><text x="720" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#163043">Model input</text><text x="720" y="350" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#52646E">Numerical pixels</text><rect x="890" y="222" width="210" height="260" rx="18" fill="#FAF7EF" stroke="#BB8539" stroke-width="3"/><circle cx="916" cy="248" r="18" fill="#163043"/><text x="916" y="255" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="bold" fill="#84DAF8">4</text><text x="995" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#163043">Neural network</text><text x="995" y="350" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#52646E">Learned weights</text><rect x="1165" y="222" width="210" height="260" rx="18" fill="#FAF7EF" stroke="#BB8539" stroke-width="3"/><circle cx="1191" cy="248" r="18" fill="#163043"/><text x="1191" y="255" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" font-weight="bold" fill="#84DAF8">5</text><text x="1270" y="310" text-anchor="middle" font-family="Georgia,serif" font-size="24" font-weight="bold" fill="#163043">Prediction</text><text x="1270" y="350" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="18" fill="#52646E">Output scores</text><path d="M280 355 H329" stroke="#27A9E5" stroke-width="5" marker-end="url(#arr)"/><path d="M555 355 H604" stroke="#27A9E5" stroke-width="5" marker-end="url(#arr)"/><path d="M830 355 H879" stroke="#27A9E5" stroke-width="5" marker-end="url(#arr)"/><path d="M1105 355 H1154" stroke="#27A9E5" stroke-width="5" marker-end="url(#arr)"/><text x="170" y="443" text-anchor="middle" font-family="Georgia,serif" font-size="83" font-style="italic" fill="#163043">7</text>
