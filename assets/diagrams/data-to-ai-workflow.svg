<rect x="340" y="540" width="760" height="98" rx="15" fill="#0C1B2B" stroke="#84DAF8" stroke-width="2"/>
<text x="720" y="578" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="23" font-weight="bold" fill="#F4E9D0">Correct label (ground truth): 7</text>
<text x="720" y="611" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="19" fill="#84DAF8">A label is supplied with a training example; it is not the model's prediction.</text>
<text x="720" y="676" text-anchor="middle" font-family="Aptos,Arial,sans-serif" font-size="17" fill="#F4E9D0">Schematic only. The predicted value is intentionally unspecified; no model was run.</text></svg>